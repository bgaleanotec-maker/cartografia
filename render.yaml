services:
  - type: web
    name: gestor-cartografico
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-cartografico-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: gestor-cartografico-db
    databaseName: gestor_cartografico
    user: gcapp
    plan: free
